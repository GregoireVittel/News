name: Daily static edition
on:
  workflow_dispatch:
  # Publishes at 07:00, 12:00 and 19:00 Europe/Paris. GitHub cron is UTC-only,
  # so both the winter (CET) and summer (CEST) times are listed; the gate job
  # lets only the ones matching Paris time today publish. See scripts/schedule_gate.py.
  schedule:
    - cron: '57 4 * * *'   # 06:57 CEST
    - cron: '57 5 * * *'   # 06:57 CET
    - cron: '57 9 * * *'   # 11:57 CEST
    - cron: '57 10 * * *'  # 11:57 CET
    - cron: '57 16 * * *'  # 18:57 CEST
    - cron: '57 17 * * *'  # 18:57 CET

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-edition
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: scripts/schedule_gate.py
          sparse-checkout-cone-mode: false
      - id: check
        env:
          CRON: ${{ github.event.schedule }}
        run: python3 scripts/schedule_gate.py "$CRON" | tee -a "$GITHUB_OUTPUT"

  publish:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Get the previous published version
        run: |
          scripts/site_branch.sh fetch "$RUNNER_TEMP/previous"
          # First run after the switch: carry history over from main instead.
          if [ -z "$(ls -A "$RUNNER_TEMP/previous")" ]; then
            echo "HISTORY=." >> "$GITHUB_ENV"
          else
            echo "HISTORY=$RUNNER_TEMP/previous" >> "$GITHUB_ENV"
          fi
      - name: Test and generate edition
        run: |
          python -m unittest discover -s tests -p 'test_build*.py'
          node --test tests/*.test.cjs
          python scripts/build_edition.py --output "$RUNNER_TEMP/news-edition" --base-url https://gregoirevittel.github.io/News/ --history-root "$HISTORY"
      - name: Save as the current version (keeps only current + previous)
        run: scripts/site_branch.sh save "$RUNNER_TEMP/news-edition"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/news-edition
      - id: deployment
        uses: actions/deploy-pages@v4
