name: Daily static edition
on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-edition
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test and generate edition
        run: |
          python -m unittest discover -s tests -p 'test_build*.py'
          node --test tests/*.test.cjs
          python scripts/build_edition.py --output "$RUNNER_TEMP/news-edition" --base-url https://gregoirevittel.github.io/News/ --history-root .
          python -c 'import os, shutil; shutil.copytree(os.environ["RUNNER_TEMP"] + "/news-edition", ".", dirs_exist_ok=True)'
      - name: Commit edition and archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html archive lang feed.xml sitemap.xml pl en fr rss.xml build-info.json articles.json assets
          git add --all -- '20*/index.html' '20*/pl/index.html' '20*/en/index.html' '20*/fr/index.html' '20*/articles.json'
          if ! git diff --cached --quiet; then
            git commit -m "news: generate daily edition"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
